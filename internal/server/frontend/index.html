<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode-hud</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="title">opencode-hud <span id="live-dot" class="dot" title="live"></span></div>
  <div class="datenav">
    <button id="mode-day" class="active" title="Day view">Day</button>
    <button id="mode-month" title="Month view">Month</button>
    <span id="day-nav">
      <button id="day-prev" title="Previous day">‹</button>
      <input type="date" id="day-picker">
      <button id="day-next" title="Next day">›</button>
      <button id="day-today" hidden>Today</button>
    </span>
    <span id="month-nav" hidden>
      <button id="month-prev" title="Previous month">‹</button>
      <input type="month" id="month-picker">
      <button id="month-next" title="Next month">›</button>
      <button id="month-today" hidden>This month</button>
    </span>
  </div>
</header>
<nav>
  <button id="tab-today" class="active">Today</button>
  <button id="tab-sessions">Sessions</button>
</nav>
<main>
  <section id="view-today">
    <div class="cards">
      <div class="card"><div class="k">Cost</div><div class="v" id="c-cost">–</div></div>
      <div class="card"><div class="k">Messages</div><div class="v" id="c-msgs">–</div></div>
      <div class="card"><div class="k">Sessions</div><div class="v" id="c-sess">–</div></div>
      <div class="card"><div class="k">Input</div><div class="v" id="c-in">–</div></div>
      <div class="card"><div class="k">Output</div><div class="v" id="c-out">–</div></div>
      <div class="card"><div class="k">Cache read</div><div class="v" id="c-cache">–</div></div>
    </div>
    <h2>Active now</h2>
    <div id="active"><p class="muted">No active sessions.</p></div>
  </section>
  <section id="view-sessions" hidden>
    <div id="sessions"></div>
  </section>
</main>
<footer><span id="updated" class="muted"></span></footer>
<script src="/app.js"></script>
</body>
</html>
